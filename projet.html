<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Projet | Tim Crebessegues</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <nav id="navbar">
        <ul class="nav-links">
            <li><a href="index.html">RETURN (Retourner au Hub)</a></li>
        </ul>
    </nav>

    <main>
        <section class="section" style="margin-top: 50px;">
            <h2 id="projet-titre">* Chargement des données...</h2>
            <div class="project-card">
                <div id="readme-content" class="markdown-body">
                    * Connexion au serveur GitHub en cours...
                </div>
                <br><br>
                <a href="index.html" class="btn">RETURN (Retour)</a>
            </div>
        </section>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const titre = urlParams.get('titre');
        const readmeUrl = urlParams.get('readme');

        if (titre) {
            document.getElementById('projet-titre').innerText = "* Fichier : " + titre;
        }

        const modal = document.createElement('div');
        modal.classList.add('modal-zoom');
        document.body.appendChild(modal);

        if (readmeUrl) {
            fetch(readmeUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Fichier introuvable");
                    return response.text();
                })
                .then(text => {
                    document.getElementById('readme-content').innerHTML = marked.parse(text);
                    
                    const contentArea = document.getElementById('readme-content');
                    contentArea.addEventListener('click', (e) => {
                        if (e.target.tagName === 'IMG') {
                            modal.innerHTML = `<img src="${e.target.src}" alt="Zoom">`;
                            modal.classList.add('active');
                        }
                    });
                })
                .catch(error => {
                    document.getElementById('readme-content').innerHTML = "* Erreur : Impossible de charger la sauvegarde.";
                });
        }
        
        modal.addEventListener('click', () => {
            modal.classList.remove('active');
        });
    </script>
</body>
</html>
